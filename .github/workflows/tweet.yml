name: Docker Image CI for GHCR

on:
 push:
  path: 
   - "services/tweets/**"

jobs:
 build_and_publish:
  runs-on: ubuntu-latest

  steps:
   - uses: actions/checkout@v4  
   - name: Login to GHCR
     run: |
       docker login --username abdulmoiz-bit --password ${{ secrets.GH_PAT }} ghcr.io 

   - name: Login to Docker Hub
     run: |
       docker login --username moizrashid --password ${{ secrets.DOCKER_HUB_TOKEN }}

   - name: Bild for GHCR and Docker Hub
     run: |
       docker build ./services/tweets --tag ghcr.io/abdulmoiz-bit/twittertweet:latest --tag abdulmoiz/twittertweet:latest

   - name: Push to GHCR
     run: |
      docker push ghcr.io/abdulmoiz-bit/twittertweet:latest

   - name: Push to Docker Hub
     run: |
      docker push moizrashid/twittertweet:latest
   
