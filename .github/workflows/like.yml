name: Docker Image CI for GHCR and DOCKER HUB

on:
 push:
  path: 
   - "services/like/**"

jobs:
 build_and_publish:
  runs-on: ubuntu-latest

 
  steps:
   - uses: actions/checkout@v4  
   - name: Login to GHCR
     run: |
       docker login --username abdulmoiz-bit --password ${{ secrets.GH_PAT }} ghcr.io 

   - name: Login to Docker Hub
     run: |
       docker login --username moizrashid --password ${{ secrets.DOCKER_HUB_TOKEN }}

   - name: Bild for GHCR and Docker Hub
     run: |
       docker build ./services/like --tag ghcr.io/abdulmoiz-bit/twitterlike:latest --tag moizrashid/twitterlike:latest

   - name: Push to GHCR
     run: |
      docker push ghcr.io/abdulmoiz-bit/twitterlike:latest

   - name: Push to Docker Hub
     run: |
      docker push moizrashid/twitterlike:latest
